[project]
name = "jevgram"
version = "0.1.0"
description = "Upload a research paper and see which sentences read as human written, AI assisted or AI generated, judged by Jev"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "typesafe-sdk>=0.7.0",
    "uvicorn[standard]>=0.53.0",
]

[project.urls]
Repository = "https://github.com/sandroandric/JevGram"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
